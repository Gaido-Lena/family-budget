<script>
// ---------- Базовые данные и хелперы ----------
const NAME={w:'Лена',h:'Арс'},CARD={w:'Карта Лены',h:'Карта Арса'};
const CATS=['Еда','Дом','Дети','Здоровье','Авто','Личное','Одежда','Развлечения','Подарки','Подписки','Прочее'];
const PAYDAY={w:{s:15,a:30},h:{s:15,a:27}};
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const monthName=ym=>MN[+ym.slice(5)-1]+' '+ym.slice(0,4);
const addM=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const mdiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));
const START='2026-11';
const now=new Date();
const todayYm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const todayIso=todayYm+'-'+String(now.getDate()).padStart(2,'0');
const curYm=todayYm<START?START:todayYm;
const MONTHS=Array.from({length:mdiff(START,curYm)+12},(_,i)=>addM(START,i));
const fmt=n=>{n=Math.round((+n||0)*100)/100;return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:Math.abs(n%1)>0.004?2:0}).format(n)+' ₽'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const cl=o=>JSON.parse(JSON.stringify(o));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtD=(ym,day)=>day?String(day).padStart(2,'0')+'.'+ym.slice(5)+'.'+ym.slice(0,4):monthName(ym);
const sum=a=>a.reduce((s,x)=>s+x,0);

// ---------- Состояние и хранилище ----------
const COLS=['checks','loans','bills','wishes','income','spend','pays','jobs'];
const S={checks:{},loans:{},bills:{},wishes:{},income:{},spend:{},pays:{},jobs:{},settings:{savings:46494.21,rate:11.25,ws:80000,wa:30000,hs:50000,ha:50000}};
const ui={tab:'ov',month:curYm,filter:'all',cyc:{w:null,h:null},scope:'m',cats:'p',pending:null,pendVal:'',payEdit:null,payVal:''};
let sb=null,canWrite=true,started=false;
function setSync(t,on){$('#syncTxt').textContent=t;$('#dot').className='dot'+(on?' on':'')}
const TBL='docs';
async function put(col,id,data){
  if(!sb)return;
  if(col==='settings')S.settings={...S.settings,...data};else S[col][id]=data;
  render();
  try{
    const row=col==='settings'?{col:'settings',id:'main',data:S.settings}:{col,id,data};
    const {error}=await sb.from(TBL).upsert({...row,updated_at:new Date().toISOString()});
    if(error)throw error;
  }catch(e){setSync('Не удалось сохранить. Проверьте интернет и повторите',false)}
}
async function del(col,id){
  if(!sb)return;
  delete S[col][id];render();
  try{const {error}=await sb.from(TBL).delete().eq('col',col).eq('id',id);if(error)throw error}catch(e){setSync('Не удалось удалить. Проверьте интернет и повторите',false)}
}
async function loadAll(){
  const {data,error}=await sb.from(TBL).select('col,id,data');
  if(error)throw error;
  const fresh={};COLS.forEach(c=>fresh[c]={});let st=null;
  data.forEach(r=>{if(r.col==='settings')st=r.data;else if(fresh[r.col])fresh[r.col][r.id]=r.data});
  COLS.forEach(c=>S[c]=fresh[c]);if(st)S.settings={...S.settings,...st};
  setSync('Общая база: Лена и Арс видят одно и то же',true);render();
}
function onChange(p){
  const t=p.eventType;
  if(t==='DELETE'){const o=p.old||{};if(S[o.col])delete S[o.col][o.id]}
  else{const r=p.new;if(r.col==='settings')S.settings={...S.settings,...r.data};else if(S[r.col])S[r.col][r.id]=cl(r.data)}
  render();
}
async function startData(){
  if(started)return;started=true;
  try{await loadAll()}catch(e){setSync('Нет доступа к базе. Войдите заново',false);started=false;return}
  sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:TBL},onChange).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&started)loadAll().catch(()=>{})});
}
async function initStore(){
  const cfg=window.SUPA||{};
  if(!cfg.url||String(cfg.url).startsWith('__')||!window.supabase){setSync('Подключение к базе не настроено',false);return}
  sb=window.supabase.createClient(cfg.url,cfg.key);
  const lg=$('#login');
  $('#loginForm').addEventListener('submit',async e=>{
    e.preventDefault();const m=$('#loginMsg');m.textContent='Вхожу…';
    const {error}=await sb.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPass').value});
    m.textContent=error?'Неверная почта или пароль.':'';
  });
  $('#logoutBtn').addEventListener('click',()=>sb.auth.signOut());
  sb.auth.onAuthStateChange((ev,s)=>{
    if(s){lg.hidden=true;$('#logoutBtn').hidden=false;startData()}
    else{lg.hidden=false;$('#logoutBtn').hidden=true;started=false;setSync('Войдите, чтобы увидеть данные',false)}
  });
  const {data:{session}}=await sb.auth.getSession();
  if(!session){lg.hidden=false;setSync('Войдите, чтобы увидеть данные',false)}
}

// ---------- Финансовая логика ----------
const INC=w=>w==='w'?(+S.settings.ws||0)+(+S.settings.wa||0):(+S.settings.hs||0)+(+S.settings.ha||0);
const billActive=(b,ym)=>(b.start||START)<=ym&&(!b.end||ym<=b.end)&&!(b.pause||[]).includes(ym);

// Ставка: если в договоре указана, берём её. Иначе подбираем так, чтобы график из остатка, платежа и числа платежей сошёлся.
function impliedRate(B,p,n){
  if(!(B>0&&p>0&&n>0)||p*n<=B)return 0;
  let lo=0,hi=0.2;
  for(let i=0;i<80;i++){const r=(lo+hi)/2,v=p*(1-Math.pow(1+r,-n))/r;if(v>B)lo=r;else hi=r}
  return (lo+hi)/2;
}
function monthlyRate(L){
  if(L.kind==='installment')return 0;
  if(L.rate!=null&&L.rate!==''&&!isNaN(+L.rate))return +L.rate/1200;
  return impliedRate(+L.balance,+L.payment,+L.left);
}
// Досрочки: из истории кредита и из допдоходов, направленных на этот кредит.
function prepaysFor(L,id){
  const m={};
  (L.events||[]).forEach(e=>{if(e.type==='prepay'&&e.ym)m[e.ym]=(m[e.ym]||0)+(+e.sum||0)});
  Object.values(S.income).forEach(x=>{const a=x.alloc;if(a&&a.type==='loan'&&a.id===id&&x.ym)m[x.ym]=(m[x.ym]||0)+(+a.sum||0)});
  return m;
}
const SC={};
function sched(id){
  if(id in SC)return SC[id];
  const L=S.loans[id];let res=null;
  if(L&&L.balance!=null&&L.balance!==''&&L.left!=null&&L.left!==''&&+L.payment>0){
    const r=monthlyRate(L),pre=prepaysFor(L,id);
    let bal=+L.balance,pay=+L.payment,left=+L.left,ym=L.asOf||START;const rows=[],byYm={};
    for(let i=0;i<600&&bal>0.005;i++){
      const interest=bal*r;let pr=pay-interest,p=pay;
      if(left<=1||pr>=bal){pr=bal;p=bal+interest}
      bal-=pr;
      const extra=Math.min(pre[ym]||0,bal);bal-=extra;
      const row={ym,pay:p,interest,principal:pr,extra,bal:Math.max(0,bal)};
      rows.push(row);byYm[ym]=row;left--;

// ---------- Даты выплат и циклы ----------

const isOff=iso=>{const d=new Date(iso+'T00:00:00Z'),wd=d.getUTCDay();return wd===0||wd===6||HOL.includes(iso.slice(5))};

const cycList=k=>{const o=[];MONTHS.forEach(m=>['A','Z'].forEach(x=>o.push({id:m+':'+x,ym:m,x,...cyc(k,m,x)})));return o};
const curCycle=k=>{const l=cycList(k);return l.find(c=>c.start<=todayIso&&todayIso<=c.end)||l[0]};

  const p=l[i-1],st=cycStats(k,p.ym,p.x),skipId='skip__'+k+'__'+p.ym+'__'+p.x;
  return {id:p.id,ym:p.ym,x:p.x,start:p.start,end:p.end,skipId,missed:st.missed,skipped:!!S.checks[skipId]};

function monthItems(ym,who){

    if(per==='sa'){

// Места работы: у каждого своя сумма аванса и зарплаты. Если мест работы нет, берутся суммы из настроек.
const jobsOf=k=>Object.entries(S.jobs).filter(([,j])=>j.who===k).sort((a,b)=>(a[1].ord||0)-(b[1].ord||0)||(a[1].name||'').localeCompare(b[1].name||''));
const payId=(k,ym,x,j)=>k+'__'+ym+'__'+x+(j?'__'+j:'');
function incParts(k,ym,x){
  const mk=(id,name,def)=>{const o=S.pays[payId(k,ym,x,id)],set=!!o&&o.sum!=null&&o.sum!=='';return {id,name,def,set,sum:set?(+o.sum||0):def}};

// Итоги цикла: факт (оплачено и потрачено) и прогноз (все плановые платежи).
function cycStats(k,ym,x){
  const c=cyc(k,ym,x),items=monthItems(ym,k).filter(i=>i.per===(x==='A'?'a':'s'));
  const ips=incParts(k,ym,x),baseSet=ips.some(p=>p.set),base=sum(ips.map(p=>p.sum));
  const exs=Object.entries(S.income).filter(([,i])=>i.who===k&&inR(i.date||(i.ym+'-01'),c));
  const sps=Object.entries(S.spend).filter(([,i])=>i.who===k&&inR(i.date||(i.ym+'-01'),c));
  // Лимитные платежи (например, продукты): чеки той же категории считаются внутри лимита, а не сверх него.
  const lim=items.filter(i=>i.limit),limCats=new Set(lim.map(i=>i.cat));
  lim.forEach(i=>{i.spent=sum(sps.filter(([,e])=>(e.cat||'Прочее')===i.cat).map(([,e])=>+e.sum||0))});
  const ex=sum(exs.map(([,i])=>+i.sum||0)),sp=sum(sps.filter(([,e])=>!limCats.has(e.cat||'Прочее')).map(([,e])=>+e.sum||0));

}

const wdOf=iso=>WD[new Date(iso+'T00:00:00Z').getUTCDay()];

function fillTargets(root){
  const sel=root.querySelector('.iTarget'),prev=sel.value;
  const ls=Object.entries(S.loans).filter(([id,L])=>L.status!=='closed'&&sched(id));
  const ws=Object.entries(S.wishes).filter(([,w])=>w.status!=='bought');
  sel.innerHTML='<option value="">В общий баланс на текущие расходы</option>'
    +(ls.length?`<optgroup label="Досрочно по кредиту">${ls.map(([id,L])=>`<option value="loan:${id}">${esc(L.name)}</option>`).join('')}</optgroup>`:'')
    +(ws.length?`<optgroup label="На потребность или цель">${ws.map(([id,w])=>`<option value="wish:${id}">${esc(w.name)} · ${fmt(w.sum)}</option>`).join('')}</optgroup>`:'');
  if([...sel.options].some(o=>o.value===prev))sel.value=prev;
}
function renderPerson(k){
  const root=$('#tab-'+k);
  if(document.activeElement&&(document.activeElement.id==='pendIn'||document.activeElement.id==='payIn')&&root.contains(document.activeElement))return;
  if(!ui.cyc[k])ui.cyc[k]=curCycle(k).id;
  const [ym,x]=ui.cyc[k].split(':'),st=cycStats(k,ym,x),c=st.c,now=c.start<=todayIso&&todayIso<=c.end;
  root.querySelector('.cycSel').value=ui.cyc[k];
  root.querySelector('.pInfo').textContent=`${x==='A'?'Аванс':'Зарплата'} приходит ${ruShort(c.pay)} (${wdOf(c.pay)})${c.pay!==c.nominal?`, вместо ${ruShort(c.nominal)} из-за выходного`:''}. Цикл: ${ruShort(c.start)} – ${ruShort(c.end)}${now?' · идёт сейчас':''}`;
  root.querySelector('.pKpi').innerHTML=kpi('Доход цикла',fmt(st.income))+kpi('Факт. расход',fmt(st.paid+st.sp))+kpi('Остаток сейчас',fmt(st.fact),freeCol(st.fact))+kpi('Прогноз остатка',fmt(st.forecast),freeCol(st.forecast));
  root.querySelector('.pMeter i').style.width=(st.plan?Math.min(100,st.paid/st.plan*100):0)+'%';
  root.querySelector('.pNote').textContent=`Оплачено ${fmt(st.paid)} из ${fmt(st.plan)} плановых платежей`;
  const al=root.querySelector('.pAlert');
  if(st.fact<0){al.hidden=false;al.className='alert pAlert';al.textContent=`Внимание: дефицит средств. Отмечено оплат и расходов на ${fmt(st.paid+st.sp)}, а дохода в цикле ${fmt(st.income)}.`}
  else if(st.forecast<0){al.hidden=false;al.className='alert warn pAlert';al.textContent=`Прогноз: на все платежи цикла не хватит ${fmt(-st.forecast)}. Подумайте, что перенести или чем добрать.`}
  else al.hidden=true;
  // напоминание о неотмеченном в прошлом цикле
  {const pv=prevCycleInfo(k),box=root.querySelector('.pPrev');
   if(pv&&pv.missed.length&&!pv.skipped&&ui.cyc[k]!==pv.id){
     box.hidden=false;
     box.innerHTML=`<b>В прошлом цикле не всё отмечено</b> (${pv.x==='A'?'аванс':'зарплата'}, ${ruShort(pv.start)} – ${ruShort(pv.end)}): ${esc(pv.missed.map(i=>i.name).join(', '))}.<div class="actions"><button class="btn" data-open-cyc="${k}|${pv.id}">Открыть прошлый цикл</button><button class="btn ghost" data-skip-cyc="${k}|${pv.skipId}"${dis()}>Всё в порядке, скрыть</button></div>`;
   }else box.hidden=true}
  // доходы
  const tgt=a=>{if(!a)return '';const L=a.type==='loan'?S.loans[a.id]:S.wishes[a.id];return L?` <span class="chip ok">→ ${esc(L.name)}: ${fmt(a.sum)}</span>`:''};
  const payRow=st.ips.map(p=>{
    const pid=payId(k,ym,x,p.id),editing=ui.payEdit===pid,ref=k+'|'+p.id;
    const lbl=p.name?`${esc(p.name)} · ${x==='A'?'аванс':'зарплата'} · ${ruShort(c.pay)}`:`${x==='A'?'Аванс':'Зарплата'} · ${ruShort(c.pay)}`;
    return `<div class="row pr"><span class="pl">${lbl} ${p.set?'<span class="chip ok" style="font-size:11px">точная сумма</span>':'<span class="chip mute" style="font-size:11px">ожидаемая</span>'}</span><span class="pa"><span class="num">${fmt(p.sum)}</span> <button class="btn ghost" data-pay-edit="${ref}"${dis()}>${p.set?'Изменить':'Указать точную'}</button></span></div>`
    +(editing?`<div class="pend" style="padding-left:0"><span>Сколько пришло, ₽</span><input type="number" id="payIn" min="0" step="any" value="${ui.payVal}"><button class="btn pri" data-pay-ok="${ref}">Сохранить</button>${p.set?`<button class="btn ghost" data-pay-reset="${ref}">Сбросить к ожидаемой</button>`:''}<button class="btn ghost" data-pay-cancel="1">Отмена</button></div>`:'');
  }).join('');
  root.querySelector('.pInc').innerHTML=payRow
    +st.exs.sort((a,b)=>(a[1].date||'').localeCompare(b[1].date||'')).map(([id,i])=>`<div class="row"><span>${esc(i.name)} <span class="mute small">${i.date?ruShort(i.date):''}</span>${tgt(i.alloc)}</span><span class="num">+${fmt(i.sum)} <button class="btn ghost" data-del-inc="${id}"${dis()}>Убрать</button></span></div>`).join('');
  // платежи
  const row=i=>{
    if(i.limit){
      const left=i.sum-i.spent,over=left<0,p=i.sum?Math.min(100,i.spent/i.sum*100):0;
      return `<div class="lim"><div class="lh"><span>${esc(i.name)}${' · лимит'}</span><span class="num">${fmt(i.spent)} из ${fmt(i.sum)}</span></div><div class="meter${over?' bad':p>85?' warn':''}" role="img" aria-label="Потрачено ${Math.round(p)}% лимита"><i style="width:${p}%"></i></div><div class="small ${over?'':'mute'}"${over?' style="color:var(--bad)"':''}>${over?`Превышение ${fmt(-left)}`:`Осталось ${fmt(left)}`} · чеки вносите ниже в «Прочие расходы» с категорией «${esc(i.cat)}»</div></div>`;
    }
    const ck=S.checks[i.key],on=!!ck,nm=(i.float?'~ ':'')+i.name;
    const known=on&&i.float&&ck.amount!=null;
    let h=`<label class="chk${on?' done':''}"><input type="checkbox" data-key="${i.key}" data-ym="${i.key.slice(0,7)}"${on?' checked':''}${dis()}><span class="t">${esc(nm)}</span><span class="num">${known?fmt(effSum(i)):(i.float?'~ ':'')+fmt(i.sum)}</span></label>`;
    if(i.float&&on&&ui.pending!==i.key)h+=`<div class="pend"><span class="mute">План ${fmt(i.sum)}</span><button class="btn ghost" data-pend-edit="${i.key}"${dis()}>Изменить сумму</button></div>`;
    if(ui.pending===i.key)h+=`<div class="pend"><span>Сумма по квитанции, ₽</span><input type="number" id="pendIn" min="0" step="any" value="${ui.pendVal}"><button class="btn pri" data-pend-ok="${i.key}">Подтвердить</button><button class="btn ghost" data-pend-cancel="1">Отмена</button></div>`;
    return h;
  };
  root.querySelector('.pBills').innerHTML=st.items.length?st.items.map(row).join(''):'<div class="empty">В этом цикле платежей нет.</div>';
  // прочие расходы
  root.querySelector('.pSpend').innerHTML=st.sps.length?st.sps.sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')).map(([id,i])=>`<div class="row"><span>${esc(i.name||i.cat||'Расход')} <span class="mute small">${esc(i.cat&&i.name?i.cat+' · ':'')}${ruDate(i.date)}</span></span><span class="num">${fmt(i.sum)} <button class="btn ghost" data-del-spend="${id}"${dis()}>Убрать</button></span></div>`).join(''):'<div class="empty">Расходов вне платежей пока нет. Добавьте покупку кнопкой ниже.</div>';
  fillTargets(root);
  if(root.dataset.cyc!==ui.cyc[k]){
    root.dataset.cyc=ui.cyc[k];
    const d0=now?todayIso:c.start;
    root.querySelector('.sDate').value=d0;root.querySelector('.iDate').value=d0;
    root.querySelector('.sDate').min=c.start;root.querySelector('.sDate').max=c.end;root.querySelector('.iDate').min=c.start;root.querySelector('.iDate').max=c.end;
  }
}

    box.innerHTML=js.map(([id,j])=>`<div style="margin-bottom:12px"><div class="lh"><b>${esc(j.name)}</b><button class="btn ghost" data-del-job="${id}"${dis()}>Убрать</button></div>

      <label class="small mute" for="jz_${id}">Зарплата, ${PAYDAY[k].s}-го</label><input type="number" id="jz_${id}" data-job="${id}:s" min="0" step="any" value="${+j.s||0}" style="width:100%"${dis()}></div>`).join('')

function renderWishes(){
  const all=Object.entries(S.wishes),plan=all.filter(([,w])=>w.status!=='bought');
  const needAll=sum(plan.map(([id,w])=>Math.max(0,(+w.sum||0)-funded(id)))),setAside=sum(plan.map(([id])=>funded(id)));
  const totalAll=sum(plan.map(([,w])=>+w.sum||0));
  $('#wSummary').innerHTML=`Отложено <b class="num">${fmt(setAside)}</b> из <b class="num">${fmt(totalAll)}</b> на все цели в планах`;
  const F=[['all','Все'],['small','Мелкие до 3 000 ₽'],['mid','Дорогие от 3 000 ₽'],['big','Крупные цели']];
  $('#wFilter').innerHTML=F.map(([k,t])=>`<button type="button" data-filter="${k}" aria-pressed="${ui.filter===k}">${t}</button>`).join('');
  const l=all.filter(([,w])=>ui.filter==='all'||wishKind(w)===ui.filter).sort((a,b)=>((a[1].status==='bought')-(b[1].status==='bought'))||((a[1].prio||2)-(b[1].prio||2))||((a[1].due||'9').localeCompare(b[1].due||'9')));
  $('#mgWishes').innerHTML=l.map(([id,w])=>{
    const f=funded(id),bought=w.status==='bought';
    const pct=w.sum?Math.min(100,f/w.sum*100):0;
    return `<div class="row" style="display:block;${bought?'opacity:.6':''}">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><b>${esc(w.name)}</b><span class="num" style="font-weight:500">${fmt(w.sum)}</span></div>
      <div class="small mute">${PRIO[w.prio||2]} приоритет${w.due?' · к '+w.due.split('-').reverse().join('.'):''}${w.big?' · крупная цель':''}</div>
      ${!bought?`<div class="small" style="margin-top:6px"><span class="chip ${f>=w.sum?'ok':f>0?'warn':'mute'}">Отложено ${fmt(f)} из ${fmt(w.sum)}</span></div><div class="meter${f>=w.sum?'':f>0?' warn':''}" role="img" aria-label="Отложено ${Math.round(pct)}%"><i style="width:${pct}%"></i></div><form class="wsf" data-id="${id}" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input type="number" class="wAmt" step="any" placeholder="Сколько отложили, ₽" style="width:160px" required${dis()}><button class="btn" type="submit"${dis()}>Отложить</button>${(+w.saved||0)>0?`<button class="btn ghost" type="button" data-wish-reset="${id}"${dis()}>Сбросить</button>`:''}</form>`:''}
      <div class="actions">${bought?`<span class="chip mute">Куплено</span><button class="btn ghost" data-wish-back="${id}"${dis()}>Вернуть</button>`:`<button class="btn" data-wish-buy="${id}"${dis()}>Куплено</button>`}<button class="btn ghost" data-del-wish="${id}"${dis()}>Убрать</button></div></div>`}).join('')||'<div class="empty">Здесь пусто. Внесите то, что скоро понадобится: наполнитель, порошок, годовой интернет.</div>';
}

function showTab(t){
  ui.tab=t;

function arm(btn,label){
  if(btn.dataset.armed){return true}
  btn.dataset.armed='1';const old=btn.textContent;btn.textContent=label||'Точно удалить?';
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},4000);

document.addEventListener('click',e=>{

  else if(d.payOk){const v=+ui.payVal;if(!(v>=0)||ui.payVal==='')return;const[k0,j0]=d.payOk.split('|'),[ym0,x0]=ui.cyc[k0].split(':');ui.payEdit=null;put('pays',payId(k0,ym0,x0,j0),{who:k0,ym:ym0,x:x0,job:j0,sum:v,at:Date.now()})}
  else if(d.payReset){const[k0,j0]=d.payReset.split('|'),[ym0,x0]=ui.cyc[k0].split(':');ui.payEdit=null;del('pays',payId(k0,ym0,x0,j0))}
  else if(d.delJob){if(!arm(t))return;del('jobs',d.delJob)}

  else if(d.openCyc){const[k0,cid]=d.openCyc.split('|');ui.cyc[k0]=cid;ui.pending=null;ui.payEdit=null;render();window.scrollTo({top:0})}
  else if(d.skipCyc){const[,sid]=d.skipCyc.split('|');put('checks',sid,{skip:true,at:Date.now()})}
  else if(d.edLoan){loanFormFill(d.edLoan);const det=$('#loanDet');det.open=true;if(det.scrollIntoView)det.scrollIntoView({behavior:'smooth',block:'center'})}
  else if(d.edBill){billFormFill(d.edBill);const det=$('#billDet');det.open=true;if(det.scrollIntoView)det.scrollIntoView({behavior:'smooth',block:'center'})}
  else if(d.closeLoan){if(!arm(t,'Закрыть окончательно?'))return;const L=cl(S.loans[d.closeLoan]);L.closedSum=Math.round((balNow(d.closeLoan)||0)*100)/100;L.status='closed';L.closedAt=todayIso;L.closedYm=curYm;put('loans',d.closeLoan,L)}
  else if(d.reopenLoan){const L=cl(S.loans[d.reopenLoan]);L.status='active';delete L.closedAt;delete L.closedYm;delete L.closedSum;put('loans',d.reopenLoan,L)}
  else if(d.delLoan){if(!arm(t))return;del('loans',d.delLoan)}
  else if(d.delEv){const[id,i]=d.delEv.split(':'),L=cl(S.loans[id]);L.events.splice(+i,1);put('loans',id,L)}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('monthSel')){ui.month=t.value;render()}
  else if(t.classList.contains('cycSel')){ui.cyc[t.dataset.who]=t.value;ui.pending=null;ui.payEdit=null;render()}

    if(!t.checked){del('checks',t.dataset.key);return}
    const k0=t.dataset.key,item=['w','h'].flatMap(w=>monthItems(k0.slice(0,7),w)).find(i=>i.key===k0);
    if(item&&item.float){ui.pending=k0;ui.pendVal=item.sum;t.checked=false;render();const p=document.getElementById('pendIn');if(p)p.focus();return}
    put('checks',k0,{ym:t.dataset.ym,key:k0,at:Date.now()});
  }
  else if(t.dataset.set){put('settings',null,{[t.dataset.set]:Math.max(0,+t.value||0)})}
  else if(t.dataset.job){const[id,fld]=t.dataset.job.split(':');if(S.jobs[id])put('jobs',id,{...cl(S.jobs[id]),[fld]:Math.max(0,+t.value||0)})}

document.addEventListener('input',e=>{if(e.target.id==='pendIn')ui.pendVal=e.target.value;if(e.target.id==='payIn')ui.payVal=e.target.value});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();if(!canWrite)return;
  if(f.classList.contains('incForm')){
    const name=f.querySelector('.iName').value.trim(),s=+f.querySelector('.iSum').value,tv=f.querySelector('.iTarget').value,al=f.querySelector('.iAlloc').value,date=f.querySelector('.iDate').value;
    if(!name||!(s>0)||!date)return;
    const doc={ym:date.slice(0,7),date,who:f.dataset.who,name,sum:s,at:Date.now()};
    if(tv){const[type,id]=tv.split(':');doc.alloc={type,id,sum:Math.min(s,al!==''&&+al>0?+al:s)}}
    put('income',newId(),doc);
    if(doc.alloc&&doc.alloc.type==='wish'){const w=S.wishes[doc.alloc.id];if(w&&w.status!=='bought'&&funded(doc.alloc.id)>=(+w.sum||0)){const w2=cl(w);w2.status='bought';put('wishes',doc.alloc.id,w2)}}
    f.querySelector('.iName').value='';f.querySelector('.iSum').value='';f.querySelector('.iAlloc').value='';f.querySelector('.iTarget').value='';
  }else if(f.classList.contains('spendForm')){
    const date=f.querySelector('.sDate').value,s=+f.querySelector('.sSum').value;if(!date||!(s>0))return;
    put('spend',newId(),{ym:date.slice(0,7),who:f.dataset.who,date,cat:f.querySelector('.sCat').value.trim(),name:f.querySelector('.sName').value.trim(),sum:s,at:Date.now()});
    f.querySelector('.sSum').value='';f.querySelector('.sName').value='';
  }else if(f.classList.contains('wsf')){
    const id=f.dataset.id,w=S.wishes[id],v=+f.querySelector('.wAmt').value;if(!w||!v)return;
    const w2=cl(w);w2.saved=Math.max(0,(+w2.saved||0)+v);put('wishes',id,w2);
  }else if(f.classList.contains('jobForm')){
    const nm=f.querySelector('.jName').value.trim();if(!nm)return;
    put('jobs',newId(),{who:f.querySelector('.jWho').value,name:nm,s:+f.querySelector('.jS').value||0,a:+f.querySelector('.jA').value||0,ord:Date.now()});
    f.querySelector('.jName').value='';f.querySelector('.jS').value='';f.querySelector('.jA').value='';
  }else if(f.id==='loanForm'){
    const id=$('#lfId').value||newId(),old=S.loans[id]?cl(S.loans[id]):{};
    const n=v=>v===''?null:+v;
    put('loans',id,{...old,name:$('#lfName').value.trim(),who:$('#lfWho').value,kind:$('#lfKind').value,payment:+$('#lfPay').value,day:n($('#lfDay').value),per:$('#lfPer').value,
      balance:n($('#lfBal').value),left:n($('#lfLeft').value),asOf:$('#lfAsOf').value||curYm,paidBefore:+$('#lfBefore').value||0,prio:n($('#lfPrio').value),startDate:$('#lfStart').value||'',lastDate:$('#lfLastDate').value||'',lastSum:n($('#lfLastSum').value),rate:n($('#lfRate').value),mode:$('#lfMode').value,
      status:old.status||'active',events:old.events||[]});
    loanFormFill(null);$('#loanDet').open=false;
  }else if(f.id==='evForm'){
    const id=$('#evLoan').value;if(!id||!S.loans[id])return;const L=cl(S.loans[id]);
    L.events=L.events||[];L.events.push({type:$('#evType').value,ym:$('#evYm').value||curYm,sum:+$('#evSum').value||0,note:$('#evNote').value.trim()});
    put('loans',id,L);$('#evSum').value='';$('#evNote').value='';
  }else if(f.id==='billForm'){
    const id=$('#bfId').value||newId();
    put('bills',id,{name:$('#bfName').value.trim(),who:$('#bfWho').value,per:$('#bfPer').value,sum:+$('#bfSum').value,float:$('#bfFloat').value==='1',limit:$('#bfFloat').value==='L',cat:$('#bfCat').value.trim(),start:$('#bfStart').value||START,end:$('#bfEnd').value||'',
      pause:$('#bfPause').value.split(',').map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}$/.test(x))});
    billFormFill(null);$('#billDet').open=false;
  }else if(f.id==='wishForm'){
    const name=$('#wfName').value.trim(),s=+$('#wfSum').value;if(!name||!(s>0))return;
    put('wishes',newId(),{name,sum:s,prio:+$('#wfPrio').value,due:$('#wfDue').value,big:!!$('#wfBig').value,status:'plan',at:Date.now()});f.reset();
  }
});
